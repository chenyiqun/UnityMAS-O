defaults:
  - ppo_trainer
  - _self_

trainer:
  topology: star
  llm_engines:
    - model_id: L0
      nnodes: 1
      n_gpus_per_node: 8
      accelerator_type: null
      strategy: fsdp2
      model_path: null
    - model_id: L1
      nnodes: 1
      n_gpus_per_node: 8
      accelerator_type: null
      strategy: fsdp2
      model_path: null
  routing:
    policy: epoch_dynamic
    refresh_every_epoch: true

star:
  workflow:
    name: single_agent
    max_inflight_queries: 64
    max_parallel_rollouts_per_model: 32
    query_timeout_seconds: 0
    query_timeout_drop: false
    tool_timeout_seconds: 0
  buffer:
    max_items: 100000
    ttl_seconds: 7200
    dropped_query_ttl_seconds: 120
    shuffle_ready: ${oc.decode:${oc.env:STAR_BUFFER_SHUFFLE_READY,true}}
  reward:
    mode: streaming
    emit_intermediate_format: true
  train:
    drop_last: true
    enforce_divisible_batch: true
    # Cap the number of ready trajectories each model consumes per sync update.
    # Rollout samples still enter the buffer; extra ready samples remain queued
    # for later updates instead of making one PPO step process every turn.
    max_ready_items: ${oc.decode:${oc.env:STAR_MAX_READY_ITEMS,${oc.env:ACTOR_PPO_MINI_BATCH_SIZE,64}}}
    # Empty reward batches normally mean the workflow timed out or every query
    # was dropped. Fail fast instead of spending more 900s timeout windows.
    max_empty_reward_streak: ${oc.decode:${oc.env:STAR_MAX_EMPTY_REWARD_STREAK,3}}
    # A failed PPO update or rollout weight sync leaves model/rollout state
    # inconsistent. Stop immediately instead of continuing with stale workers.
    fail_on_update_error: ${oc.decode:${oc.env:STAR_FAIL_ON_UPDATE_ERROR,true}}
    # Multi-LLM STAR jobs can update disjoint model worker groups in parallel.
    # Large colocated models may disable this through the launcher for memory headroom.
    parallel_ppo_updates: ${oc.decode:${oc.env:STAR_PARALLEL_PPO_UPDATES,true}}
    # STAR code workflows treat each dataloader batch as a closed training unit:
    # after its PPO update, do not carry residual ready/incomplete trajectories
    # into the next batch.
    clear_buffers_after_update: ${oc.decode:${oc.env:STAR_CLEAR_BUFFERS_AFTER_UPDATE,true}}
    # Match verl's single-model resource handoff: after rollout/reward commit and
    # before PPO compute, wait for the model-local rollout queue/server to go idle.
    rollout_quiesce_timeout_seconds: ${oc.decode:${oc.env:STAR_ROLLOUT_QUIESCE_TIMEOUT_SECONDS,120}}
    rollout_quiesce_stable_checks: ${oc.decode:${oc.env:STAR_ROLLOUT_QUIESCE_STABLE_CHECKS,2}}

actor_rollout_ref:
  rollout:
    mode: async
    free_cache_engine: false
    calculate_log_probs: true

algorithm:
  rollout_correction:
    bypass_mode: true
